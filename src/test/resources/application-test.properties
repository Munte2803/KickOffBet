# Test profile: in-memory H2 (PostgreSQL mode), no external services, no schedulers.
spring.datasource.url=jdbc:h2:mem:kickoffbet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DAY
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2Dialect + UUID result mapping for native queries (see H2TestDialect)
spring.jpa.properties.hibernate.dialect=com.munte.KickOffBet.support.H2TestDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.jpa.defer-datasource-initialization=true

app.scheduling.enabled=false

jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1raWNrb2ZmYmV0LXRlc3RzLW9ubHktMjU2LWJpdHMhIQ==
spring.mail.host=localhost
spring.mail.username=test
spring.mail.password=test
app.mail.from=test@kickoffbet.test
minio.access-key=test
minio.secret-key=test
football.data.api.token=test

# Generous limits so integration tests are not throttled; rate-limit tests override these.
rate-limit.auth.capacity=10000
rate-limit.global.capacity=10000
rate-limit.ticket.capacity=10000
rate-limit.email.capacity=10000

# Sync: no artificial delays or cooldown so the admin sync endpoints can be exercised quickly
sync.api-delay-ms=0
sync.rate-limit-wait-ms=0
sync.cooldown-seconds=0
