# Production overlay. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is published to the host (80/443). Every other service is reachable
# solely over the internal docker network (by service name). The OCI Security List
# should allow ONLY 22/80/443 inbound as the hard gate.

services:
  db:
    ports: !reset []

  adminer:
    # Not exposed in prod. Reach it via an SSH tunnel if you ever need it:
    #   ssh -L 8888:localhost:8888 user@vps  (after temporarily publishing it)
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

  frontend:
    ports: !reset []
    # Same-origin in prod: leave VITE_API_BASE_URL empty so axios uses window.location.origin
    build:
      context: ./Kickoffbet-ui
      args:
        VITE_API_BASE_URL: ""

  # Self-hosted, cookie-less web analytics. Reuses the existing Postgres, but with its own
  # role (UMAMI_DB_USER) that owns only the 'umami' database: a bug in umami can't reach the
  # betting data. Create both once: see docs/umami-db.sql. The tracker (/kob.js) and its
  # collector (/api/send) are proxied first-party on DOMAIN; the dashboard on ANALYTICS_DOMAIN
  # only answers the IPs in ANALYTICS_ALLOWED_IPS (see Caddyfile). Default login is
  # admin/umami — CHANGE IT on first sign-in. Pinned (3.4.0 = postgresql-latest as of
  # 2026-10); bump deliberately, umami migrates its schema on start.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${UMAMI_DB_USER:?set UMAMI_DB_USER}:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN}
      # Space-separated IPs/CIDRs allowed to open the umami dashboard (default: nobody)
      ANALYTICS_ALLOWED_IPS: ${ANALYTICS_ALLOWED_IPS:-127.0.0.1/32}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - minio
      - umami

volumes:
  caddy_data:
  caddy_config:
