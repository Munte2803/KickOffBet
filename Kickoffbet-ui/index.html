<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kickoffbet-ui</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      // Mirrors the logic in stores/theme.store.ts (key: 'kob-theme').
      (function () {
        try {
          var pref = localStorage.getItem('kob-theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Self-hosted umami analytics (cookie-less). Replace the website-id with the
         one shown in the umami dashboard after creating the site, then rebuild the
         frontend. Harmless 404 locally where /analytics isn't served. -->
    <script
      defer
      src="/analytics/script.js"
      data-website-id="REPLACE_WITH_UMAMI_WEBSITE_ID"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
